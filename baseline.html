<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agency CXO Office — Interactive 3D</title><style>body{margin:0;background:#15120f;color:#eee;font:14px system-ui}canvas{display:block}header{position:fixed;z-index:2;top:0;left:0;right:0;padding:20px;background:linear-gradient(#17120eee,transparent);pointer-events:none}h1{font:24px Georgia;margin:0}small{color:#d2b993}footer{position:fixed;bottom:0;left:0;right:0;padding:16px;background:#17120ed9}button{float:right;background:#6a4b2d;color:white;border:1px solid #b89c72;padding:10px;cursor:pointer}#error{position:fixed;top:40%;padding:20px;background:#442f28;display:none}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script></head><body><header><h1>THE EXECUTIVE SUITE</h1><small>15 × 12 METRES · VINTAGE ADVERTISING AGENCY · INTERACTIVE PROTOTYPE</small></header><div id="error"></div><footer><button id="reset">Reset camera</button>Drag to rotate · Scroll to zoom · Right-drag to pan<br><small>Early blockout — photorealistic licensed furniture is not yet installed.</small></footer><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
try{
const scene=new T.Scene();scene.background=new T.Color('#827d75');const camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);camera.position.set(12,8,13);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.4;document.body.prepend(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.4,0);orbit.enableDamping=true;orbit.update();
scene.add(new T.HemisphereLight(0xdfe7ed,0x5c3d2c,2.5));const sun=new T.DirectionalLight(0xffd6a4,3);sun.position.set(-3,9,5);scene.add(sun);
function box(n,w,h,d,x,y,z,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,roughness:.75}));m.position.set(x,y,z);m.name=n;scene.add(m);return m}
box('Parquet floor',15,.1,12,0,-.05,0,'#553825');box('Walnut rear wall',15,4.5,.15,0,2.25,-6,'#3f2b21');box('Left wall',.15,4.5,12,-7.5,2.25,0,'#4e3426');box('Right wall',.15,4.5,12,7.5,2.25,0,'#4e3426');box('Panoramic window',7,3,.06,0,2.4,6,'#79969a');
for(let x=-7;x<8;x+=1.7)box('Wall panelling',.09,4.3,.13,x,2.2,-5.85,'#80583a');
box('Executive desk',3.7,.15,1.9,-3.5,.82,-2,'#603b25');for(let x of [-4.95,-2.05])box('Desk pedestal',.7,1.4,1.65,x,.68,-2,'#3c261a');
function chair(x,z){box('Leather chair seat',.9,.17,.82,x,.55,z,'#493126');box('Leather chair back',.9,1.1,.16,x,1.1,z-.35,'#2b201b');for(let dx of [-.3,.3])for(let dz of [-.28,.28])box('Chair leg',.07,.5,.07,x+dx,.25,z+dz,'#34271e')}
chair(-3.5,-3.8);chair(-4.35,.2);chair(-2.65,.2);
function sofa(x,z,w){box('Leather sofa base',w,.4,1.2,x,.42,z,'#56372b');box('Leather sofa back',w,.9,.22,x,.83,z-.49,'#3d2b23');for(let a of [-1,1])box('Sofa arm',.25,.6,1.2,x+a*(w/2-.12),.72,z,'#442d24');for(let i=0;i<3;i++)box('Sofa cushion',w/3-.07,.12,.8,x-w/2+(i+.5)*w/3,.7,z+.08,'#76513a')}
sofa(3,2.1,3.2);sofa(5.6,-.7,2.2);box('Coffee table',1.8,.15,1.1,3,.6,.25,'#64422b');box('Persian rug',6,.03,3.5,2,.02,1,'#713d35');
box('Projection screen',5,2.9,.07,1,2.35,-5.79,'#e1dbce');box('Projector table',1.3,.13,.95,1,.9,3.8,'#533523');box('Film projector',.65,.48,.6,1,1.35,3.8,'#3d3f3c');
for(let x of [.72,1.28]){let r=new T.Mesh(new T.TorusGeometry(.3,.055,10,32),new T.MeshStandardMaterial({color:'#aaa28c',metalness:.65,roughness:.3}));r.position.set(x,1.88,3.8);scene.add(r)}
box('Creative pinboard',3,2,.1,5.7,2.4,-5.8,'#8b6b4b');box('Bookshelf',2.1,3.5,.65,-6.1,1.75,2.7,'#543624');
for(let y=.4;y<3.4;y+=.55){box('Shelf',2,.08,.72,-6.1,y,2.7,'#8a6243');for(let i=0;i<9;i++)box('Book',.12,.3+(i%3)*.05,.38,-7+i*.22,y+.18,2.7,['#7c4c36','#55645c','#aa8761'][i%3])}
document.getElementById('reset').onclick=()=>{camera.position.set(12,8,13);orbit.target.set(0,1.4,0);orbit.update()};
function frame(){requestAnimationFrame(frame);orbit.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){const el=document.getElementById('error');el.style.display='block';el.textContent='Renderer error: '+e.message;console.error(e)}
</script></body></html>
